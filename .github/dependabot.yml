version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      groups:
          github-actions:
              patterns:
                  - '*'
          github-actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7

    - package-ecosystem: 'composer'
      directories:
          - '/'
          - '/tools/php-cs-fixer'
          - '/tools/phpstan'
          - '/tools/twig-cs-fixer'
      schedule:
          interval: 'monthly'
      groups:
          composer:
              patterns:
                  - '*'
          composer-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7
