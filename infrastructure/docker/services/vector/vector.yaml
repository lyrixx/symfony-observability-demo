data_dir: /var/lib/vector

api:
  enabled: true
  address: '0.0.0.0:8686'

sources:
  syslog:
    type: syslog
    mode: udp
    address: '0.0.0.0:9000'

transforms:
  syslog_json:
    inputs:
      - syslog
    type: remap
    source: |
      . = parse_json!(.message)
      # Use the application's own record time (it may be backdated, e.g. by
      # the demo's log generator) instead of Vector's ingestion time, so
      # every sink below indexes/queries logs by when they actually happened.
      .timestamp = parse_timestamp(.datetime, format: "%+") ?? now()
      .host = get_hostname() ?? "n/a"
      .environment = get_env_var("VECTOR_ENVIRONMENT") ?? "development"
      .application = get_env_var("VECTOR_APPLICATION") ?? "app"

sinks:
  elasticsearch:
    inputs:
      - syslog_json
    type: elasticsearch
    mode: bulk
    endpoints:
      - 'http://elasticsearch:9200'
    bulk:
      index: app-%Y.%m.%d
      action: create
  loki:
    inputs:
      - syslog_json
    type: loki
    encoding:
      codec: json
    endpoint: 'http://loki:3100'
    healthcheck: false
    # Backdated (simulated historical) logs land with an earlier timestamp
    # than what's already been sent for the same stream. Let Loki decide
    # instead of Vector silently dropping them as "out of order".
    out_of_order_action: accept
    labels:
      host: '{{ host }}'
      environment: '{{ environment }}'
      application: '{{ application }}'
      channel: '{{ channel }}'
      level: '{{ level_name }}'
  clickhouse:
    inputs:
      - syslog_json
    type: clickhouse
    # format: json_as_string
    endpoint: 'http://clickhouse:8123'
    database: app
    table: logs
    healthcheck: false
    auth:
      strategy: basic
      password: app
      user: app
    skip_unknown_fields: true
